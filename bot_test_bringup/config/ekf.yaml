ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

#The _config arrays are which state variables each sensor contributes (x,y,z, roll,pitch,yaw, vx,vy,vz, vroll,vpitch,vyaw, ax,ay,az
    
    odom0: /diff_drive_controller/odom
    odom0_config: [false,  false,  false,
                   false, false, false,
                   true,  false,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false,  false,  false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

