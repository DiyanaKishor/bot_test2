amcl:
  ros__parameters:
    use_sim_time: true

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # 3. Increase Rotation Noise Tolerance (Default is usually ~0.05-0.1)
    alpha1: 0.3  # Rotational noise from rotation (Tells AMCL to distrust rotational odom)
    alpha2: 0.1  # Rotational noise from translation
    alpha3: 0.1  # Translational noise from translation
    alpha4: 0.3  # Translational noise from rotation

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    min_particles: 500
    max_particles: 2000
    laser_max_range: 12.0
    laser_model_type: "likelihood_field"
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1

    transform_tolerance: 1.0   # Increase from default (0.2s) to 1.0s for Gazebo





map_server:
  ros__parameters:
    use_sim_time: true
    #yaml_filename: ""   # supplied via launch arg, not hardcoded here

amcl_map_client:
  ros__parameters:
    use_sim_time: true

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ['map_server', 'amcl']


controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5 # Minimum distance the robot must move to be considered as making progress
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15 # Minimum distance from the goal position to be considered as having reached the goal
      yaw_goal_tolerance: 0.2 # Minimum angular difference from the goal orientation to be considered as having reached the goal
      stateful: true #the bot remembers the goal stste is reached 

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.8                  # Slightly increased so the arc target is further out
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      max_angular_accel: 2.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      use_cost_regulated_linear_velocity_scaling: false

      # --- CONTINUOUS FORWARD ARC TURNING ---
      use_rotate_to_heading: false         # Set to FALSE to completely block in-place Z-axis spins
      allow_reversing: false              # Set to FALSE to prevent backing up across the room
      min_turning_radius: 0.0             # Single entry: enforces minimum 0.4m arc radius

      # Speed scaling on curves
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.05


local_costmap:
  local_costmap:
    ros__parameters:

      transform_tolerance: 0.2

      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true #keeps the costmap centered on the robot, it updates new area as it moves while discading old,rather than a fixed area in the world, 
      width: 3 #in meters, no fixed botsize to costmap relation, its simply how far thr bot must be able to see 
      height: 3 # thumbs rule , make the cost mapatlest 2 to 3x bigger then the max dimention of thr bot
      resolution: 0.05
      footprint: "[[0.15, 0.125], [0.15, -0.125], [-0.15, -0.125], [-0.15, 0.125]]" # Native YAML 2D array, 2d box for avoiding colliton 

      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan #has to be /scan not just scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer: #adds a buffer zone around obstacles
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3

global_costmap:
  global_costmap:
    ros__parameters:

      transform_tolerance: 0.2

      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.15, 0.125], [0.15, -0.125], [-0.15, -0.125], [-0.15, 0.125]]" # Native YAML 2D array
      resolution: 0.05
      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer: #takes the map from the map server and uses it to create a static costmap layer, which is used for global path planning.
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      minimum_turning_radius: 0.35  # Generates sweeping Dubins loops when turns > 45° are needed
      motion_model_for_search: "DUBIN"
      downsample_costmap: false
      tolerance: 1.0
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      smooth_path: true
      
      # --- HYBRID A* KINEMATICS ---
      minimum_turning_radius: 0.5     # Matches your robot's desired minimum arc radius
      motion_model_for_search: "DUBIN" # Forces forward-only arc curves (no Reeds-Shepp reversing)
      angle_quantization_bins: 72

      # --- FORCE MIDWAY ARC PLANNING ---
      analytic_expansion_max_length: 10.0     # Attempt full Dubins arcs from up to 10m away (default is ~3.0m)
      analytic_expansion_ratio: 5.0           # Check for direct Dubins curve connections more aggressively

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"

bt_navigator: #bt - behavior tree
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    max_velocity: [1.0, 0.0, 1.0] #[x,y,z] adjust the max velocity of the bot in x,y and z direction, for a differential drive bot y is always 0cle
    min_velocity: [-1.0, 0.0, -1.0]
    max_accel: [1.0, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -1.0]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator", "velocity_smoother", "collision_monitor",'waypoint_follower'] # Add 'waypoint_follower' to the list of managed nodes

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
    polygons: ["PolygonStop"]
    PolygonStop:
      type: "polygon"
      points: "[[0.20, 0.175], [0.20, -0.175], [-0.20, -0.175], [-0.20, 0.175]]"
      action_type: "stop"
      min_points: 3
      visualize: true
      polygon_pub_topic: "polygon_stop"

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 1000 # Time to pause at each waypoint (in milliseconds)